# Baut die beiden Container-Images und schiebt sie in die GitHub Container
# Registry. Der Server zieht dann fertige Bilder statt selbst zu bauen:
#   docker compose --profile prod pull && docker compose --profile prod up -d
# Hintergrund und Einrichtung: BETRIEB.md, Teil B4.

name: Images bauen und nach GHCR schieben

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ghcr.io/janpow77/pdf-editor-${{ matrix.component }}:latest
            ghcr.io/janpow77/pdf-editor-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
