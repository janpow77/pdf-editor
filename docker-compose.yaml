# PDF-Editor-App — eigenständiger Stack (kein Bezug zum audit_designer-Stack).
#
# Lokal:      docker compose up --build          → http://localhost:8080
# Produktion: docker compose --profile prod up -d  (zusätzlich cloudflared;
#             TUNNEL_TOKEN in .env bzw. /etc/pdf-editor/env setzen)

services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=pdfapp
      - POSTGRES_USER=pdfapp
      - POSTGRES_PASSWORD=${PDFAPP_DB_PASSWORD:?PDFAPP_DB_PASSWORD muss gesetzt sein}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdfapp -d pdfapp"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PDFAPP_DATABASE_URL=postgresql+psycopg2://pdfapp:${PDFAPP_DB_PASSWORD:?}@db:5432/pdfapp
      - PDFAPP_SECRET_KEY=${PDFAPP_SECRET_KEY:?PDFAPP_SECRET_KEY muss gesetzt sein}
      - PDFAPP_ADMIN_EMAIL=${PDFAPP_ADMIN_EMAIL:-}
      - PDFAPP_ADMIN_PASSWORD=${PDFAPP_ADMIN_PASSWORD:-}
      - PDFAPP_MAX_FILE_SIZE_MB=${PDFAPP_MAX_FILE_SIZE_MB:-50}
      - PDFAPP_MAX_TOTAL_SIZE_MB=${PDFAPP_MAX_TOTAL_SIZE_MB:-200}
      - PDFAPP_MAX_FILE_SIZE_MB_AUTHED=${PDFAPP_MAX_FILE_SIZE_MB_AUTHED:-100}
      - PDFAPP_MAX_TOTAL_SIZE_MB_AUTHED=${PDFAPP_MAX_TOTAL_SIZE_MB_AUTHED:-400}
      - PDFAPP_RATE_LIMIT_DEFAULT=${PDFAPP_RATE_LIMIT_DEFAULT:-30/minute;500/day}
      - PDFAPP_RATE_LIMIT_AUTHED=${PDFAPP_RATE_LIMIT_AUTHED:-60/minute;2000/day}
      - PDFAPP_SMTP_HOST=${PDFAPP_SMTP_HOST:-}
      - PDFAPP_SMTP_PORT=${PDFAPP_SMTP_PORT:-587}
      - PDFAPP_SMTP_USER=${PDFAPP_SMTP_USER:-}
      - PDFAPP_SMTP_PASSWORD=${PDFAPP_SMTP_PASSWORD:-}
      - PDFAPP_SMTP_FROM=${PDFAPP_SMTP_FROM:-noreply@flowaudit.de}
      - PDFAPP_PUBLIC_BASE_URL=${PDFAPP_PUBLIC_BASE_URL:-}
      - PDFAPP_HSTS_SECONDS=${PDFAPP_HSTS_SECONDS:-0}
      - PDFAPP_SOURCE_URL=${PDFAPP_SOURCE_URL:-}
      - PDFAPP_TURNSTILE_SITE_KEY=${PDFAPP_TURNSTILE_SITE_KEY:-}
      - PDFAPP_TURNSTILE_SECRET=${PDFAPP_TURNSTILE_SECRET:-}
      # Lokale KI: leer = deaktiviert; nur eigene Infrastruktur, keine Cloud
      - PDFAPP_LLM_URL=${PDFAPP_LLM_URL:-}
      - PDFAPP_LLM_MODEL=${PDFAPP_LLM_MODEL:-qwen3.5:35b}
      # Nur true setzen, wenn ausschließlich der Cloudflare-Tunnel Zugang hat
      - PDFAPP_TRUST_CF_HEADER=${PDFAPP_TRUST_CF_HEADER:-false}
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["prod"]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
