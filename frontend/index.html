<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kostenlose PDF-, Word- und Excel-Werkzeuge – ohne Registrierung, ohne Datenspeicherung."
    />
    <link rel="icon" type="image/png" href="/auditlogo.png" />
    <link rel="apple-touch-icon" href="/auditlogo.png" />
    <title>PDF-Editor – kostenlos &amp; ohne Datenspeicherung</title>
    <script>
      /*
       * Das Erscheinungsbild wird vor dem Laden des Vue-Bundles gesetzt. So
       * entsteht bei gespeichertem Dunkelmodus kein heller Zwischenzustand.
       * Gesperrter Browser-Speicher fällt sicher auf die Systempräferenz zurück.
       */
      (() => {
        let preference = 'system'
        try {
          const stored = window.localStorage.getItem('pdfapp_theme_preference')
          if (stored === 'light' || stored === 'dark' || stored === 'system') preference = stored
        } catch {
          // Die Systempräferenz bleibt auch ohne persistenten Speicher verfügbar.
        }
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const dark = preference === 'dark' || (preference === 'system' && systemDark)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
