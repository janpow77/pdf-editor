server {
    listen 80;
    server_name _;

    # Upload-Limit: muss >= Backend-Gesamtlimit sein (PDFAPP_MAX_TOTAL_SIZE_MB)
    client_max_body_size 410m;

    root /usr/share/nginx/html;
    index index.html;

    # Version des Webservers nicht preisgeben — erspart Angreifern die
    # Zuordnung bekannter Schwachstellen.
    server_tokens off;

    # Kompression für Text-Assets. PDFs, Bilder und Office-Dateien laufen über
    # /api/ und sind bereits komprimiert — die stehen bewusst nicht in gzip_types.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Vorkomprimierte .gz-Dateien aus dem Build ausliefern, statt bei jedem
    # Abruf neu zu komprimieren (spart CPU und liefert bessere Kompression).
    gzip_static on;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Accept-Encoding $http_accept_encoding;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Das Backend setzt dieselben Kopfzeilen selbst (app/hardening.py) —
        # nötig, falls es ohne diesen Proxy erreichbar ist. Hier werden sie
        # ausgeblendet und durch die eigenen ersetzt, damit die Antwort genau
        # einen Satz trägt: doppelte Content-Security-Policy-Kopfzeilen wendet
        # der Browser zwar als Schnittmenge an, sie machen aber jede
        # Fehlersuche zäh.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header X-Permitted-Cross-Domain-Policies;
        proxy_hide_header Cache-Control;
        # Verrät sonst „uvicorn" und damit den eingesetzten Stapel.
        proxy_hide_header Server;
        include /etc/nginx/security-headers.conf;

        # Verarbeitete Dokumente und Kontodaten dürfen nirgends zwischenliegen
        # — weder im Browser-Cache noch in einem vorgelagerten Proxy. Das ist
        # die Kopfzeilen-Entsprechung des Versprechens „keine Datenspeicherung".
        add_header Cache-Control "no-store" always;
    }

    # ES-Module mit der Endung .mjs — hier der pdf.js-Worker.
    #
    # nginx' mitgelieferte mime.types kennt `.mjs` nicht und antwortet mit
    # application/octet-stream. Zusammen mit `X-Content-Type-Options: nosniff`
    # verweigert der Browser die Ausführung: Der Worker startet nicht, die
    # Seitenvorschau bleibt leer — die Anzeige, die Textbearbeitung, die
    # Anmerkungen und der Formular-Designer sind dann unbenutzbar.
    #
    # Ohne nosniff fiel das nicht auf, weil der Browser den Typ erraten hat.
    # Die Härtung hätte den Fehler also erst in der Produktion sichtbar
    # gemacht. `types { }` leert die Typtabelle für diesen Block, sodass
    # `default_type` greift — der dokumentierte Weg, einen Typ zu erzwingen.
    #
    # Die Regex-Regel steht vor /assets/, weil nginx reguläre Ausdrücke
    # gegenüber Präfix-Blöcken bevorzugt; Kopfzeilen und Cache-Steuerung
    # müssen deshalb hier wiederholt werden.
    location ~* \.mjs$ {
        include /etc/nginx/security-headers.conf;
        types { }
        default_type text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Gehashte Build-Artefakte (index-a1b2c3.js) sind unveränderlich: ein neuer
    # Build erzeugt einen neuen Dateinamen. Ein Jahr Cache spart bei jedem
    # Folgebesuch den kompletten Bundle-Download.
    #
    # Bewusst ohne `expires`: Die Direktive setzt ein eigenes Cache-Control und
    # führte zusammen mit dem add_header zu zwei Kopfzeilen in einer Antwort.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html darf nie aus dem Cache kommen — sonst zeigt der Browser nach
    # einem Deploy weiter auf die alten Asset-Hashes.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
