server {
    listen 80;
    server_name _;

    # Upload-Limit: muss >= Backend-Gesamtlimit sein (PDFAPP_MAX_TOTAL_SIZE_MB)
    client_max_body_size 410m;

    root /usr/share/nginx/html;
    index index.html;

    # Kompression für Text-Assets. PDFs, Bilder und Office-Dateien laufen über
    # /api/ und sind bereits komprimiert — die stehen bewusst nicht in gzip_types.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Vorkomprimierte .gz-Dateien aus dem Build ausliefern, statt bei jedem
    # Abruf neu zu komprimieren (spart CPU und liefert bessere Kompression).
    gzip_static on;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Accept-Encoding $http_accept_encoding;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Gehashte Build-Artefakte (index-a1b2c3.js) sind unveränderlich: ein neuer
    # Build erzeugt einen neuen Dateinamen. Ein Jahr Cache spart bei jedem
    # Folgebesuch den kompletten Bundle-Download.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html darf nie aus dem Cache kommen — sonst zeigt der Browser nach
    # einem Deploy weiter auf die alten Asset-Hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
