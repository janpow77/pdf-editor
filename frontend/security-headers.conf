# Sicherheitskopfzeilen für alle Antworten dieser Anwendung.
#
# Bewusst als eigene Datei und per `include` eingebunden: In nginx ersetzt ein
# `add_header` in einem location-Block **alle** geerbten Kopfzeilen. Ohne die
# Einbindung in jedem betroffenen Block würden die Header genau dort fehlen,
# wo zusätzlich Cache-Steuerung gesetzt wird — ein Fehler, der beim Testen der
# Startseite nicht auffällt.
#
# `always` sorgt dafür, dass die Kopfzeilen auch bei Fehlerantworten (404, 413,
# 502) gesetzt werden. Genau die erzeugt nginx selbst, wenn das Backend nicht
# antwortet — dann kann dessen eigene Middleware nichts mehr beitragen.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Die Anwendung liefert PDFs aus; ohne diese Angabe könnten Adobe-Laufzeiten
# eine seitenweite Cross-Domain-Richtlinie annehmen.
add_header X-Permitted-Cross-Domain-Policies "none" always;
